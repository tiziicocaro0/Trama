
name: CI Trama

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar proyecto backend
        id: backend
        shell: bash
        run: |
          if [ -f demo/mvnw ] && [ -f demo/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "directory=demo" >> "$GITHUB_OUTPUT"
          elif [ -f backend/mvnw ] && [ -f backend/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "directory=backend" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Backend pendiente de integracion"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Java 21
        if: steps.backend.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ejecutar tests del backend
        if: steps.backend.outputs.exists == 'true'
        working-directory: ${{ steps.backend.outputs.directory }}
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar proyecto frontend
        id: frontend
        shell: bash
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Frontend pendiente de integracion"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js
        if: steps.frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar lint
        if: steps.frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm run lint

      - name: Ejecutar tests
        if: steps.frontend.outputs.exists == 'true'
        working-directory: ./frontend
        run: npm test -- --run
