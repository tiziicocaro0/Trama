spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/trama
    username: trama
    password: ${MYSQL_PASSWORD}

  jpa:
    show-sql: false

  # Correo: Gmail o Mailpit segun las variables del .env
  mail:
    host: ${SPRING_MAIL_HOST:${SMTP_HOST:localhost}}
    port: ${SPRING_MAIL_PORT:${SMTP_PORT:1025}}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

trama:
  mail:
    from: ${MAIL_FROM:no-reply@trama.test}

  invitaciones:
    url-base: ${INVITACION_URL_BASE:}

  # 6.1: dirección del front para los links de los mails de notificaciones
  app:
    url: ${APP_URL:http://localhost:5173}