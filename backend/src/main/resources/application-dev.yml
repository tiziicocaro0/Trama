spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/trama
    username: trama
    password: ${MYSQL_PASSWORD}

  jpa:
    show-sql: false

    # Correo de prueba con Mailpit
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

trama:
  mail:
    from: ${MAIL_FROM:no-reply@trama.test}

  invitaciones:
    url-base: ${INVITACION_URL_BASE:}

  recuperacion:
    url-base: ${RECUPERACION_URL_BASE:}