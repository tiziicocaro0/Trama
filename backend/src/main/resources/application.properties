spring.application.name=trama
spring.config.import=optional:file:../.env[.properties]

server.port=${SERVER_PORT:4002}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.profiles.default=dev

# Correo: con Gmail se activan auth y STARTTLS desde el .env (con Mailpit quedan en false)
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Archivos adjuntos (0.3): carpeta donde se guardan cifrados, fuera de la base.
# En dev, por defecto la carpeta uploads/ en la raíz del repo (ignorada por git).
trama.archivos.directorio=${UPLOADS_DIR:../uploads}

# Limites de carga de archivos - Historia 4.3
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
