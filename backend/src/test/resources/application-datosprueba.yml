# Perfil de datos de prueba (solo desarrollo, ver TramaConDatosDePrueba).
# Usa otra base para no mezclar los datos ficticios con la base trama de todos los días.
spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/trama_prueba

  # Los avisos por mail de los datos de prueba nunca salen a Gmail: van a Mailpit
  # (http://localhost:8025) si está levantado, y si no, se descartan sin cortar el arranque.
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
