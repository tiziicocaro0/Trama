services:
  mysql:
    image: mysql:8.0
    container_name: trama-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trama
      MYSQL_USER: trama
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3307:3306"
    volumes:
      - trama-mysql-data:/var/lib/mysql
      - ./bd/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u trama -p\"$${MYSQL_PASSWORD}\" trama -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  # Backend de Trama
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    image: trama-backend:local
    container_name: trama-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/trama
      DB_USERNAME: trama
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # KMS (0.3): TRAMA_CRYPTO_KEY ya no viene del .env, el backend la pide a OpenBao.
      OPENBAO_URI: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN}
      SERVER_PORT: 8080

      # Configuración del correo
      MAIL_FROM: ${MAIL_FROM:-}
      INVITACION_URL_BASE: ${INVITACION_URL_BASE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-false}

      # Archivos adjuntos cifrados (0.3)
      UPLOADS_DIR: /app/uploads

    volumes:
      - trama-uploads:/app/uploads

    ports:
      - "4002:8080"
  # Servidor de correo local para desarrollo
  mailpit:
    image: axllent/mailpit:latest
    container_name: trama-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  # Backups cifrados de la base y los archivos (0.3): corre una vez y se apaga.
  #   docker compose --profile backup run --rm backup
  backup:
    image: mysql:8.0
    profiles: ["backup"]
    depends_on:
      mysql:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # KMS (0.3): la clave de los backups se pide a OpenBao.
      OPENBAO_URI: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN}
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups
      - trama-uploads:/uploads
    entrypoint: ["sh", "/scripts/backup.sh"]
  # KMS de TRAMA (0.3): guarda TRAMA_CRYPTO_KEY y TRAMA_BACKUP_KEY. Ver docs/plan-openbao.md.
  openbao:
    image: openbao/openbao:2.7.2
    container_name: trama-openbao
    profiles: ["app", "backup"]
    restart: unless-stopped
    # La imagen ya agrega -config=/openbao/config al arrancar en modo servidor.
    command: ["server"]
    cap_add:
      - IPC_LOCK
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - trama-openbao-data:/openbao/file
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      # "bao status" devuelve 0 solo cuando está abierto: sellado cuenta como no saludable.
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  trama-mysql-data:
  trama-uploads:
  trama-openbao-data:
