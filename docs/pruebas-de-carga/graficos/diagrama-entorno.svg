<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d">
<title id="t">Cómo se armó el entorno de pruebas</title><desc id="d">Todo corre en Docker dentro de la Mac. El servidor simulado y el generador de carga usan núcleos de CPU separados.</desc><style>
  text { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; }
  .fondo { fill: #FFFDF8; } .texto { fill: #2E2E2E; } .suave { fill: #6B6B6B; }
  .grilla { stroke: #D9D4C8; stroke-width: 1; } .eje { stroke: #6B6B6B; stroke-width: 1; }
  .s0 { fill: #963417; stroke: #963417; } .s1 { fill: #008C7E; stroke: #008C7E; } .s2 { fill: #B8792E; stroke: #B8792E; }
  .s3 { fill: #B9B2A4; stroke: #B9B2A4; }
  .caja { fill: #FFFDF8; stroke: #D9D4C8; stroke-width: 1.5; } .caja-crema { fill: #F1E4CD; stroke: #D9D4C8; stroke-width: 1.5; }
  .caja-fuerte { fill: #963417; } .t-claro { fill: #FFFDF8; } .t-oliva { fill: #4B4F21; } .t-terra { fill: #963417; }
  .flecha { stroke: #6B6B6B; stroke-width: 1.6; fill: none; marker-end: url(#punta); }
  .banda { fill: #B0413E; opacity: 0.12; }
  polyline.linea { fill: none !important; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #2A2622; } .texto { fill: #F1E4CD; } .suave { fill: #BFB6A8; }
    .grilla { stroke: #4A443D; } .eje { stroke: #BFB6A8; }
    .s0 { fill: #D06A45; stroke: #D06A45; } .s1 { fill: #1FA593; stroke: #1FA593; } .s2 { fill: #B07F35; stroke: #B07F35; }
    .caja { fill: #2A2622; stroke: #4A443D; } .caja-crema { fill: #3A342D; stroke: #4A443D; } .t-oliva { fill: #C9CC9A; } .t-terra { fill: #D06A45; }
  }
</style>
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker></defs>
<rect class="fondo" width="720" height="430" rx="16"/><rect class="caja-crema" x="20" y="20" width="680" height="390" rx="14"/><text class="t-terra" x="32" y="42" font-size="13.5" font-weight="800">Mac con Docker Desktop · VM de 8 CPU y 4 GB</text><rect class="caja" x="44" y="146" width="170" height="120" rx="14"/><text class="t-terra" x="56" y="168" font-size="13.5" font-weight="800">k6 (generador)</text><text class="texto" x="56" y="188" font-size="11.5">Núcleos 4 a 7</text><text class="texto" x="56" y="204" font-size="11.5">Usuarios virtuales</text><text class="texto" x="56" y="220" font-size="11.5">Escenarios en JS</text><text class="texto" x="56" y="236" font-size="11.5">Tope 1,8 GB</text><rect class="caja-fuerte" x="250" y="64" width="290" height="220" rx="14"/><text class="t-claro" x="262" y="86" font-size="13.5" font-weight="800">Servidor simulado</text><text class="t-claro" x="262" y="106" font-size="11.5">Núcleos 0 (1 CPU) o 0-1 (2 CPU)</text><text class="t-claro" x="262" y="122" font-size="11.5">Límite de RAM por contenedor</text><text class="t-claro" x="262" y="138" font-size="11.5">Sin swap</text><rect class="caja" x="270" y="150" width="120" height="112" rx="14"/><text class="t-terra" x="282" y="172" font-size="13.5" font-weight="800">Backend</text><text class="texto" x="282" y="192" font-size="11.5">Spring Boot</text><text class="texto" x="282" y="208" font-size="11.5">Java 21</text><text class="texto" x="282" y="224" font-size="11.5">+ JFR</text><rect class="caja" x="404" y="150" width="120" height="112" rx="14"/><text class="t-terra" x="416" y="172" font-size="13.5" font-weight="800">MySQL 8</text><text class="texto" x="416" y="192" font-size="11.5">Base propia</text><text class="texto" x="416" y="208" font-size="11.5">de pruebas</text><text class="texto" x="416" y="224" font-size="11.5">+ perf_schema</text><rect class="caja" x="562" y="110" width="126" height="112" rx="14"/><text class="t-terra" x="574" y="132" font-size="13.5" font-weight="800">Mailpit</text><text class="texto" x="574" y="152" font-size="11.5">Núcleo 3</text><text class="texto" x="574" y="168" font-size="11.5">Correo falso:</text><text class="texto" x="574" y="184" font-size="11.5">recibe los mails</text><text class="texto" x="574" y="200" font-size="11.5">por SMTP</text><rect class="caja" x="44" y="300" width="636" height="90" rx="14"/><text class="t-terra" x="56" y="322" font-size="13.5" font-weight="800">Mediciones</text><text class="texto" x="56" y="342" font-size="11.5">docker stats cada 2 s (CPU, RAM, disco, red) · resumen de k6 (tiempos, errores, códigos HTTP)</text><text class="texto" x="56" y="358" font-size="11.5">Java Flight Recorder (CPU y memoria por módulo, esperas, GC) · performance_schema (consultas SQL)</text><path class="flecha" d="M214,206 L268,206"/><text class="suave" x="241" y="200" font-size="11" text-anchor="middle">HTTP</text><path class="flecha" d="M390,206 L402,206"/></svg>
