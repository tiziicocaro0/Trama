<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
<title id="t">Hoja de ruta para arreglar las vulnerabilidades</title><desc id="d">Tres etapas: primero configuración (sin tocar lógica), después código chico, después cambios grandes.</desc><style>
  text { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; }
  .fondo { fill: #FFFDF8; } .texto { fill: #2E2E2E; } .suave { fill: #6B6B6B; }
  .grilla { stroke: #D9D4C8; stroke-width: 1; } .eje { stroke: #6B6B6B; stroke-width: 1; }
  .s0 { fill: #963417; stroke: #963417; } .s1 { fill: #008C7E; stroke: #008C7E; } .s2 { fill: #B8792E; stroke: #B8792E; }
  .s3 { fill: #B9B2A4; stroke: #B9B2A4; }
  .caja { fill: #FFFDF8; stroke: #D9D4C8; stroke-width: 1.5; } .caja-crema { fill: #F1E4CD; stroke: #D9D4C8; stroke-width: 1.5; }
  .caja-fuerte { fill: #963417; } .t-claro { fill: #FFFDF8; } .t-oliva { fill: #4B4F21; } .t-terra { fill: #963417; }
  .flecha { stroke: #6B6B6B; stroke-width: 1.6; fill: none; marker-end: url(#punta); }
  .banda { fill: #B0413E; opacity: 0.12; }
  polyline.linea { fill: none !important; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #2A2622; } .texto { fill: #F1E4CD; } .suave { fill: #BFB6A8; }
    .grilla { stroke: #4A443D; } .eje { stroke: #BFB6A8; }
    .s0 { fill: #D06A45; stroke: #D06A45; } .s1 { fill: #1FA593; stroke: #1FA593; } .s2 { fill: #B07F35; stroke: #B07F35; }
    .caja { fill: #2A2622; stroke: #4A443D; } .caja-crema { fill: #3A342D; stroke: #4A443D; } .t-oliva { fill: #C9CC9A; } .t-terra { fill: #D06A45; }
  }
</style>
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker></defs>
<rect class="fondo" width="720" height="360" rx="16"/><rect class="caja-fuerte" x="20" y="20" width="220" height="320" rx="14"/><text class="t-claro" x="32" y="42" font-size="13.5" font-weight="800">Etapa 1 · 1 semana</text><text class="t-claro" x="32" y="62" font-size="11.5">Solo configuración</text><text class="t-claro" x="32" y="78" font-size="11.5"></text><text class="t-claro" x="32" y="94" font-size="11.5">· Puertos solo en 127.0.0.1</text><text class="t-claro" x="32" y="110" font-size="11.5">· Demo sin cuentas fijas</text><text class="t-claro" x="32" y="126" font-size="11.5">· Rotación de logs</text><text class="t-claro" x="32" y="142" font-size="11.5">· Cabeceras en nginx</text><text class="t-claro" x="32" y="158" font-size="11.5">· Rotación de backups</text><text class="t-claro" x="32" y="174" font-size="11.5">· Límite por IP (nginx)</text><text class="t-claro" x="32" y="190" font-size="11.5">· maxCachedBufferSize</text><text class="t-claro" x="32" y="206" font-size="11.5">· Alerta de disco</text><rect class="caja-crema" x="250" y="20" width="220" height="320" rx="14"/><text class="t-terra" x="262" y="42" font-size="13.5" font-weight="800">Etapa 2 · 2-3 semanas</text><text class="texto" x="262" y="62" font-size="11.5">Código chico, con tests</text><text class="texto" x="262" y="78" font-size="11.5"></text><text class="texto" x="262" y="94" font-size="11.5">· Log de errores 500</text><text class="texto" x="262" y="110" font-size="11.5">· 409 en vez de 500</text><text class="texto" x="262" y="126" font-size="11.5">· Login sin diferencias</text><text class="texto" x="262" y="142" font-size="11.5">  de tiempo</text><text class="texto" x="262" y="158" font-size="11.5">· Contraseña ≤ 64</text><text class="texto" x="262" y="174" font-size="11.5">· Tipo real de archivo</text><text class="texto" x="262" y="190" font-size="11.5">· open-in-view = false</text><text class="texto" x="262" y="206" font-size="11.5">· Paginación + N+1</text><rect class="caja" x="480" y="20" width="220" height="320" rx="14"/><text class="t-terra" x="492" y="42" font-size="13.5" font-weight="800">Etapa 3 · 1-2 meses</text><text class="texto" x="492" y="62" font-size="11.5">Cambios grandes</text><text class="texto" x="492" y="78" font-size="11.5"></text><text class="texto" x="492" y="94" font-size="11.5">· Actualizar Spring Boot</text><text class="texto" x="492" y="110" font-size="11.5">· Archivos por partes</text><text class="texto" x="492" y="126" font-size="11.5">· Título cifrado</text><text class="texto" x="492" y="142" font-size="11.5">  (migración)</text><text class="texto" x="492" y="158" font-size="11.5">· Revocar sesiones</text><text class="texto" x="492" y="174" font-size="11.5">· Mails en segundo plano</text><text class="texto" x="492" y="190" font-size="11.5">· Contenedores sin root</text><path class="flecha" d="M240,180 L248,180"/><path class="flecha" d="M470,180 L478,180"/></svg>
