<title id="t">En qué se va la CPU con el servidor saturado (1 CPU · 2 GB con 400 personas)</title><desc id="d">Porcentaje de las muestras de CPU de Java Flight Recorder, agrupadas por la capa que estaba trabajando.</desc>
