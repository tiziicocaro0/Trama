t="74" rx="14"/><text class="t-terra" x="542" y="240" font-size="13.5" font-weight="800">Tareas y mails</text><text class="texto" x="542" y="260" font-size="11.5">Una sola vez (bloqueo)</text><text class="texto" x="542" y="276" font-size="11.5">Cola en segundo plano</text><rect class="caja" x="530" y="302" width="170" height="74" rx="14"/><text class="t-terra" x="542" y="324" font-size="13.5" font-weight="800">OpenBao</text><text class="texto" x="542" y="344" font-size="11.5">Claves de cifrado</text><path class="flecha" d="M130,185 L158,185"/><path class="flecha" d="M280,185 L318,75"/><path class="flecha" d="M280,185 L318,185"/><path class="flecha" d="M280,185 L318,295"/><path class="flecha" d="M480,75 L513,200"/><path class="flecha" d="M480,185 L513,200"/><path class="flecha" d="M480,295 L513,200"/><text class="t-oliva" x="530" y="36" font-size="12.5" font-weight="800">Servicios compartidos</text></svg>
