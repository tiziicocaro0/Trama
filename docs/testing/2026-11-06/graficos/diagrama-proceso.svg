<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Proceso de cada prueba</title><desc id="d">La base se prepara una vez y se restaura igual antes de cada servidor, para que todos arranquen en las mismas condiciones.</desc><style>
  text { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; }
  .fondo { fill: #FFFDF8; } .texto { fill: #2E2E2E; } .suave { fill: #6B6B6B; }
  .grilla { stroke: #D9D4C8; stroke-width: 1; } .eje { stroke: #6B6B6B; stroke-width: 1; }
  .s0 { fill: #963417; stroke: #963417; } .s1 { fill: #008C7E; stroke: #008C7E; } .s2 { fill: #B8792E; stroke: #B8792E; }
  .s3 { fill: #B9B2A4; stroke: #B9B2A4; }
  .caja { fill: #FFFDF8; stroke: #D9D4C8; stroke-width: 1.5; } .caja-crema { fill: #F1E4CD; stroke: #D9D4C8; stroke-width: 1.5; }
  .caja-fuerte { fill: #963417; } .t-claro { fill: #FFFDF8; } .t-oliva { fill: #4B4F21; } .t-terra { fill: #963417; }
  .flecha { stroke: #6B6B6B; stroke-width: 1.6; fill: none; marker-end: url(#punta); }
  .banda { fill: #B0413E; opacity: 0.12; }
  polyline.linea { fill: none !important; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #2A2622; } .texto { fill: #F1E4CD; } .suave { fill: #BFB6A8; }
    .grilla { stroke: #4A443D; } .eje { stroke: #BFB6A8; }
    .s0 { fill: #D06A45; stroke: #D06A45; } .s1 { fill: #1FA593; stroke: #1FA593; } .s2 { fill: #B07F35; stroke: #B07F35; }
    .caja { fill: #2A2622; stroke: #4A443D; } .caja-crema { fill: #3A342D; stroke: #4A443D; } .t-oliva { fill: #C9CC9A; } .t-terra { fill: #D06A45; }
  }
</style>
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker></defs>
<rect class="fondo" width="720" height="300" rx="16"/><rect class="caja-crema" x="20" y="60" width="150" height="96" rx="14"/><text class="t-terra" x="32" y="82" font-size="13.5" font-weight="800">1. Preparar</text><text class="texto" x="32" y="102" font-size="11.5">200 familias</text><text class="texto" x="32" y="118" font-size="11.5">200 niños</text><text class="texto" x="32" y="134" font-size="11.5">4.000 aportes</text><rect class="caja-crema" x="194" y="60" width="150" height="96" rx="14"/><text class="t-terra" x="206" y="82" font-size="13.5" font-weight="800">2. Copiar base</text><text class="texto" x="206" y="102" font-size="11.5">Volumen</text><text class="texto" x="206" y="118" font-size="11.5">"copia-base"</text><rect class="caja-crema" x="368" y="60" width="150" height="96" rx="14"/><text class="t-terra" x="380" y="82" font-size="13.5" font-weight="800">3. Por servidor</text><text class="texto" x="380" y="102" font-size="11.5">Restaurar copia</text><text class="texto" x="380" y="118" font-size="11.5">Aplicar límites</text><text class="texto" x="380" y="134" font-size="11.5">Arrancar</text><rect class="caja-fuerte" x="542" y="60" width="158" height="96" rx="14"/><text class="t-claro" x="554" y="82" font-size="13.5" font-weight="800">4. Calentar</text><text class="t-claro" x="554" y="102" font-size="11.5">30 s con 10</text><text class="t-claro" x="554" y="118" font-size="11.5">usuarios (no se</text><text class="t-claro" x="554" y="134" font-size="11.5">cuenta)</text><rect class="caja-fuerte" x="368" y="190" width="150" height="90" rx="14"/><text class="t-claro" x="380" y="212" font-size="13.5" font-weight="800">5. Escalones</text><text class="t-claro" x="380" y="232" font-size="11.5">90 s cada uno</text><text class="t-claro" x="380" y="248" font-size="11.5">midiendo todo</text><rect class="caja" x="542" y="190" width="158" height="90" rx="14"/><text class="t-terra" x="554" y="212" font-size="13.5" font-weight="800">6. ¿Cortar?</text><text class="texto" x="554" y="232" font-size="11.5">> 10 % errores</text><text class="texto" x="554" y="248" font-size="11.5">p95 > 10 s</text><text class="texto" x="554" y="264" font-size="11.5">backend caído</text><path class="flecha" d="M170,108 L192,108"/><path class="flecha" d="M344,108 L366,108"/><path class="flecha" d="M518,108 L540,108"/><path class="flecha" d="M621,156 L443,188"/><path class="flecha" d="M518,235 L540,235"/><text class="texto" x="20" y="228" font-size="11.5" >Si no se corta, sube al escalón</text><text class="texto" x="20" y="246" font-size="11.5" >siguiente: 10, 25, 50, 100, 200,</text><text class="texto" x="20" y="264" font-size="11.5" >300, 500, 750, 1.000, 1.500.</text></svg>
