<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Abrir el perfil de un niño según cuántos aportes tiene</title><desc id="d">Tiempo p95 de la lista de aportes y la bitácora con 20 personas mirando el mismo perfil. La cruz marca que el backend dejó de responder.</desc>
