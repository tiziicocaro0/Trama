<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
<title id="t">Esfuerzo contra impacto de cada arreglo</title><desc id="d">Arriba a la izquierda: mucho impacto y poco esfuerzo. Es por donde conviene empezar.</desc><style>
  text { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; }
  .fondo { fill: #FFFDF8; } .texto { fill: #2E2E2E; } .suave { fill: #6B6B6B; }
  .grilla { stroke: #D9D4C8; stroke-width: 1; } .eje { stroke: #6B6B6B; stroke-width: 1; }
  .s0 { fill: #963417; stroke: #963417; } .s1 { fill: #008C7E; stroke: #008C7E; } .s2 { fill: #B8792E; stroke: #B8792E; }
  .s3 { fill: #B9B2A4; stroke: #B9B2A4; }
  .caja { fill: #FFFDF8; stroke: #D9D4C8; stroke-width: 1.5; } .caja-crema { fill: #F1E4CD; stroke: #D9D4C8; stroke-width: 1.5; }
  .caja-fuerte { fill: #963417; } .t-claro { fill: #FFFDF8; } .t-oliva { fill: #4B4F21; } .t-terra { fill: #963417; }
  .flecha { stroke: #6B6B6B; stroke-width: 1.6; fill: none; marker-end: url(#punta); }
  .banda { fill: #B0413E; opacity: 0.12; }
  polyline.linea { fill: none !important; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #2A2622; } .texto { fill: #F1E4CD; } .suave { fill: #BFB6A8; }
    .grilla { stroke: #4A443D; } .eje { stroke: #BFB6A8; }
    .s0 { fill: #D06A45; stroke: #D06A45; } .s1 { fill: #1FA593; stroke: #1FA593; } .s2 { fill: #B07F35; stroke: #B07F35; }
    .caja { fill: #2A2622; stroke: #4A443D; } .caja-crema { fill: #3A342D; stroke: #4A443D; } .t-oliva { fill: #C9CC9A; } .t-terra { fill: #D06A45; }
  }
</style>
<defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B6B"/></marker></defs>
<rect class="fondo" width="720" height="440" rx="16"/><rect class="caja-fuerte" x="70" y="40" width="300" height="180" rx="14"/><text class="t-claro" x="82" y="62" font-size="13.5" font-weight="800">Hacer ya</text><text class="t-claro" x="82" y="82" font-size="11.5">Puertos en 127.0.0.1 (D1)</text><text class="t-claro" x="82" y="98" font-size="11.5">Demo sin cuentas fijas (D2)</text><text class="t-claro" x="82" y="114" font-size="11.5">Límite por IP en nginx (C2)</text><text class="t-claro" x="82" y="130" font-size="11.5">Log de errores 500 (C3)</text><text class="t-claro" x="82" y="146" font-size="11.5">maxCachedBufferSize (archivos)</text><text class="t-claro" x="82" y="162" font-size="11.5">Paginación + batch fetch</text><rect class="caja-crema" x="390" y="40" width="300" height="180" rx="14"/><text class="t-terra" x="402" y="62" font-size="13.5" font-weight="800">Planificar</text><text class="texto" x="402" y="82" font-size="11.5">Actualizar Spring Boot (dep.)</text><text class="texto" x="402" y="98" font-size="11.5">Archivos por partes</text><text class="texto" x="402" y="114" font-size="11.5">open-in-view = false (rend.)</text><text class="texto" x="402" y="130" font-size="11.5">Título cifrado (C4)</text><text class="texto" x="402" y="146" font-size="11.5">Revocar sesiones (C5)</text><rect class="caja-crema" x="70" y="240" width="300" height="160" rx="14"/><text class="t-terra" x="82" y="262" font-size="13.5" font-weight="800">De paso</text><text class="texto" x="82" y="282" font-size="11.5">Rotación de logs (D3)</text><text class="texto" x="82" y="298" font-size="11.5">Cabeceras nginx (D5)</text><text class="texto" x="82" y="314" font-size="11.5">Contraseña ≤ 64 (C6)</text><text class="texto" x="82" y="330" font-size="11.5">nosniff en la foto (C8)</text><text class="texto" x="82" y="346" font-size="11.5">Rotación de backups (D6)</text><rect class="caja" x="390" y="240" width="300" height="160" rx="14"/><text class="t-terra" x="402" y="262" font-size="13.5" font-weight="800">Cuando haya tiempo</text><text class="texto" x="402" y="282" font-size="11.5">Contenedores sin root (D4)</text><text class="texto" x="402" y="298" font-size="11.5">Tipo real de archivo (C8)</text><text class="texto" x="402" y="314" font-size="11.5">Código de 8 dígitos (C7)</text><text class="texto" x="402" y="330" font-size="11.5">Login sin diferencias de</text><text class="texto" x="402" y="346" font-size="11.5">tiempo (C1)</text><text class="texto" x="14" y="140" font-size="11.5" font-weight="800">Mucho</text><text class="suave" x="14" y="156" font-size="11.5" >impacto</text><text class="texto" x="14" y="320" font-size="11.5" font-weight="800">Menos</text><text class="suave" x="14" y="336" font-size="11.5" >impacto</text><text class="texto" x="180" y="425" font-size="11.5" font-weight="800">Poco esfuerzo</text><text class="texto" x="500" y="425" font-size="11.5" font-weight="800">Mucho esfuerzo</text></svg>
