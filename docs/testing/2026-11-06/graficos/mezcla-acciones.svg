<text class="texto" x="200" y="45" font-size="13" text-anchor="end">Ver el perfil del niño</text><rect class="s1" x="210" y="32" width="420" height="20" rx="4"/><text class="suave" x="638" y="46" font-size="12">45 %</text><text class="texto" x="200" y="77" font-size="13" text-anchor="end">Leer la bitácora</text><rect class="s1" x="210" y="64" width="186.66666666666666" height="20" rx="4"/><text class="suave" x="404.66666666666663" y="78" font-size="12">20 %</text><text class="texto" x="200" y="109" font-size="13" text-anchor="end">Cargar una observación</text><rect class="s1" x="210" y="96" width="140" height="20" rx="4"/><text class="suave" x="358" y="110" font-size="12">15 %</text><text class="texto" x="200" y="141" font-size="13" text-anchor="end">Inicio (mis niños)</text><rect class="s1" x="210" y="128" width="93.33333333333333" height="20" rx="4"/><text class="suave" x="311.3333333333333" y="142" font-size="12">10 %</text><text class="texto" x="200" y="173" font-size="13" text-anchor="end">Editar una observación</text><rect class="s1" x="210" y="160" width="46.666666666666664" height="20" rx="4"/><text class="suave" x="264.6666666666667" y="174" font-size="12">5 %</text><text class="texto" x="200" y="205" font-size="13" text-anchor="end">Volver a iniciar sesión</text><rect class="s1" x="210" y="192" width="46.666666666666664" height="20" rx="4"/><text class="suave" x="264.6666666666667" y="206" font-size="12">5 %</text>
