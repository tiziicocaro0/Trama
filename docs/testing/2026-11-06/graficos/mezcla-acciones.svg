<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" width="720" height="242" role="img" aria-labelledby="t d">
<title id="t">Qué hace cada usuario virtual en el uso mezclado</title><desc id="d">Peso de cada acción. Entre acción y acción espera de 1 a 3 segundos.</desc>
<style>
  text { font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; }
  .fondo { fill: #FFFDF8; } .texto { fill: #2E2E2E; } .suave { fill: #6B6B6B; }
  .grilla { stroke: #D9D4C8; stroke-width: 1; } .eje { stroke: #6B6B6B; stroke-width: 1; }
  .anillo { stroke: #FFFDF8; }
  .s0 { stroke: #963417; fill: #963417; } .s1 { stroke: #008C7E; fill: #008C7E; } .s2 { stroke: #B8792E; fill: #B8792E; }
  .limite { stroke-dasharray: 5 4; stroke-width: 1.5; fill: none; }
  polyline.linea { fill: none !important; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .fondo { fill: #2A2622; } .texto { fill: #F1E4CD; } .suave { fill: #BFB6A8; }
