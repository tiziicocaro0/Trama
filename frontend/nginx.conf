# nginx del perfil "demo": sirve el front y reenvía /api al back.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Igual que el límite de subida del back (6 MB por pedido).
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend-demo:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Para el navegador, front y back son el mismo dominio:
        # sin el Origin, el CORS del back no interviene.
        proxy_set_header Origin "";
    }

    # Los archivos de /assets llevan un hash en el nombre: se pueden cachear.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de React (/proyectos/5/hoy, /invitaciones/abc...): siempre index.html.
    location / {
        try_files $uri /index.html;
    }
}
